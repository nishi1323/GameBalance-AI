spring.application.name=gamebalance-ai

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# Optional .env file import
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/GameBalanceAI}
spring.data.mongodb.auto-index-creation=true

# JWT
app.jwt.secret=${JWT_SECRET:GameBalanceAI_DefaultDevSecretKey_ReplaceWithLongRandomStringInProd_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Groq AI
# Groq AI
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
app.groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging
logging.level.com.gamebalance=INFO